<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="X-UA-Compatible" content="ie=edge" />
    <title>Currency Converter</title>
    <link
        rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20,400,0,0&icon_names=sync_alt"
    />
    <link rel="stylesheet" href="curr_converter.css" />
</head>
<body>
    <main>
        <h3>Currency Converter</h3>
        <input
            id="amount"
            type="number"
            placeholder="Enter your amount here"
        />
        <div class="from-to"><span>From:</span><span>To:</span></div>
        <div class="select">
            <div class="from">
                <img src="" alt="flag img" id="from_flag" />
                <select name="from_country" id="from"></select>
            </div>
            <span class="material-symbols-outlined"> sync_alt </span>
            <div class="to">
                <img src="" alt="flag img" id="to_flag" />
                <select name="to_country" id="to"></select>
            </div>
        </div>
        <div class="value"></div>
        <button id="convert">Convert your amount into INR</button>
    </main>
    <script src="currency_codes.js"></script>
    <script src="curr_converter.js"></script>
</body>
</html>
